pace="preserve" x="860" y="194" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11px" font-weight="600" fill="#8E8A82" text-anchor="start" letter-spacing="0" opacity="1">hide the device from Places</text><rect x="28" y="216" width="1144" height="38" rx="8" fill="#111419" stroke="#2A2D31"/><rect x="28" y="216" width="4" height="38" rx="2" fill="#4D5156"/><text xml:space="preserve" x="46" y="240" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12px" font-weight="600" fill="#E9E5DC" text-anchor="start" letter-spacing="0" opacity="1">"16 folders" in English</text><text xml:space="preserve" x="470" y="240" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11px" font-weight="400" fill="#8E8A82" text-anchor="start" letter-spacing="0" opacity="1">untranslated upstream strings</text><text xml:space="preserve" x="860" y="240" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11px" font-weight="600" fill="#8E8A82" text-anchor="start" letter-spacing="0" opacity="1">nothing to configure</text><rect x="28" y="262" width="1144" height="38" rx="8" fill="#111419" stroke="#2A2D31"/><rect x="28" y="262" width="4" height="38" rx="2" fill="#4D5156"/><text xml:space="preserve" x="46" y="286" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12px" font-weight="600" fill="#E9E5DC" text-anchor="start" letter-spacing="0" opacity="1">"cannot remove" on reinstall</text><text xml:space="preserve" x="470" y="286" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11px" font-weight="400" fill="#8E8A82" text-anchor="start" letter-spacing="0" opacity="1">existing files in the icon tree</text><text xml:space="preserve" x="860" y="286" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, mono